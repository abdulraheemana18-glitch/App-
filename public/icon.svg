<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020b18" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="160" stroke="#1e293b" stroke-width="2" fill="none" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" stroke="#0e7490" stroke-width="3" fill="none" opacity="0.6" />
  <!-- Quantum Core Rings -->
  <g filter="url(#glow)">
    <polygon points="256,120 373,188 373,324 256,392 139,324 139,188" stroke="url(#coreGrad)" stroke-width="8" fill="none" />
    <polygon points="256,160 339,208 339,304 256,352 173,304 173,208" stroke="#06b6d4" stroke-width="4" fill="#06b6d4" fill-opacity="0.1" />
    <!-- Center Node -->
    <circle cx="256" cy="256" r="28" fill="url(#coreGrad)" />
    <!-- Satellite Agent Nodes -->
    <circle cx="256" cy="120" r="12" fill="#06b6d4" />
    <circle cx="373" cy="188" r="12" fill="#3b82f6" />
    <circle cx="373" cy="324" r="12" fill="#6366f1" />
    <circle cx="256" cy="392" r="12" fill="#8b5cf6" />
    <circle cx="139" cy="324" r="12" fill="#06b6d4" />
    <circle cx="139" cy="188" r="12" fill="#38bdf8" />
  </g>
</svg>
